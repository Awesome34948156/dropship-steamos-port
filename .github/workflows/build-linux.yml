name: build-linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pin the runner deliberately. The Deck runs glibc 2.41 (SteamOS 20260922.1);
    # ubuntu-24.04 ships 2.39, so a binary built here runs there. A *newer* runner
    # would emit GLIBC_2.4x symbol references the Deck cannot resolve, and the only
    # symptom is "version `GLIBC_2.42' not found" when launching on device.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The lint steps below need these; naming them explicitly does not
          # depend on the action's default profile.
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe pulls in winit/glutin, which need these headers to *build* against.
      # At runtime the Deck already has all of the shared objects.
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      # Lint lives in this job, not a tag-only one: these failures should surface
      # on every pull request and push, which is where they are cheap. The
      # release job depends on this one, so a tag cannot publish un-linted code
      # either.
      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: shellcheck the installers
        run: shellcheck -s sh install.sh packaging/install.sh run.sh

      - name: syntax-check the on-device scripts
        run: |
          set -eu
          for script in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done
          # Info-level findings are not failures here: SC2015's `a && b || c`
          # idiom is used deliberately for the PASS/FAIL lines. Warnings are.
          # -x follows the shared fixture so the sourced helpers are known to
          # the scripts that use them, rather than treated as external.
          shellcheck -x -s bash -S warning scripts/*.sh scripts/lib/*.sh

      - name: test
        run: cargo test --all-targets

      - name: build
        run: cargo build --release

      # Catches a broken link line, and records which libc symbols the binary
      # actually requires, so a future glibc skew is visible in the log.
      - name: inspect linkage
        run: |
          ldd target/release/dropship-steamos
          objdump -T target/release/dropship-steamos \
            | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: dropship-steamos-linux-x86_64
          path: |
            target/release/dropship-steamos
            target/release/dropship-steamos-helper
            packaging/
            # packaging/install.sh looks for the launcher icon at
            # $REPO/assets/icons/…, relative to its own parent. Without this the
            # install now fails outright rather than installing quietly: the
            # installer's preflight requires the icon, the unit template and the
            # launcher template, and refuses to write anything if one is absent.
            assets/icons/game-icon-overwatch.svg
          if-no-files-found: error

  release:
    needs: build

    # Job-level, not workflow-level. Only this job creates a release, and a
    # workflow-level grant would hand the write token to the build job as well,
    # which runs on every pull request. A job-level grant also overrides the
    # repository's default workflow-permission setting, so this works even when
    # that default is read-only — which is otherwise the most common way a
    # pipeline like this fails silently, with a green check and no release.
    permissions:
      contents: write

    # Only a tag publishes. A push to main, a pull request, or a manual run
    # still builds and uploads the artifact above, but must never move a
    # release: the artifact is a debugging convenience, the release is a promise.
    if: startsWith(github.ref, 'refs/tags/v')

    # Nothing is compiled here, so this pin is not about glibc. It is so that
    # this file names exactly one Ubuntu version and nobody has to work out
    # which of the two jobs the "use 24.04" rule applies to.
    runs-on: ubuntu-24.04

    steps:
      # The checkout supplies install.sh, packaging/, assets/, README.md,
      # INSTALL.md and LICENSE at the tagged commit. The artifact supplies the
      # two binaries and nothing else: they cannot be rebuilt identically on a
      # second runner, so whatever the build job tested is what ships.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dropship-steamos-linux-x86_64
          path: artifact

      # The tag is the version of record. If it disagreed with Cargo.toml the
      # release would be named 0.2.0 and carry a 0.1.0 binary, and nothing
      # downstream would ever catch it.
      - name: the tag must match Cargo.toml
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          manifest=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$version" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} disagrees with Cargo.toml ($manifest)" >&2
            exit 1
          fi
          echo "packaging version $version"

      - name: stage and pack the release tree
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          stage=dropship-steamos-$version

          # -f, not -x, and this is not laziness. upload-artifact records the
          # mode in the zip, but download-artifact does not restore it, so the
          # binaries arrive non-executable. Requiring -x here failed the first
          # release run in eleven milliseconds with no output at all. The exec
          # bit is set by the install -m below regardless, so the artifact's is
          # not worth asking about — but a future failure should not be silent,
          # hence the listing.
          ls -l artifact/target/release
          test -f artifact/target/release/dropship-steamos
          test -f artifact/target/release/dropship-steamos-helper

          mkdir -p "$stage/packaging" "$stage/assets/icons"
          # install(1), not cp: every mode is stated here rather than inherited
          # from the checkout's umask or git's exec bit, so the archive is right
          # even if a file's mode in git is wrong.
          install -m 0755 artifact/target/release/dropship-steamos        "$stage/dropship-steamos"
          install -m 0755 artifact/target/release/dropship-steamos-helper "$stage/dropship-steamos-helper"
          install -m 0755 install.sh                                      "$stage/install.sh"
          install -m 0755 packaging/install.sh                            "$stage/packaging/install.sh"
          install -m 0644 packaging/dropship-steamos.service              "$stage/packaging/"
          install -m 0644 packaging/dropship-steamos.desktop              "$stage/packaging/"
          install -m 0644 assets/icons/game-icon-overwatch.svg            "$stage/assets/icons/"
          install -m 0644 README.md INSTALL.md LICENSE                    "$stage/"

          # "$stage" is a bare relative name, so no member of the archive is
          # absolute and none contains ".."; extraction produces exactly one
          # directory. Fixed mtime and zeroed ownership so two runs over the same
          # inputs differ only in the bytes of the binaries themselves. gzip -n
          # drops the timestamp and the original filename, the other two things
          # that would otherwise change on every run for no reason.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 1980-01-01' \
              -cf - "$stage" | gzip -9n > "$stage-linux-x86_64.tar.gz"

          sha256sum "$stage-linux-x86_64.tar.gz" > SHA256SUMS

      # Everything here could be checked by hand afterwards. The point of doing
      # it in the job is that a broken archive never gets a URL: a release is
      # the wrong place to discover the tarball extracts wrong.
      - name: verify the archive before it gets a URL
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          stage=dropship-steamos-$version
          tarball=$stage-linux-x86_64.tar.gz

          sha256sum -c SHA256SUMS

          # Exactly one top level, and every member underneath it.
          tar -tzf "$tarball" | grep -v '/$' | while read -r p; do
            case "$p" in
              "$stage"/*) ;;
              *) echo "unexpected path in the archive: $p" >&2; exit 1 ;;
            esac
          done

          for p in \
            "$stage/install.sh" \
            "$stage/dropship-steamos" \
            "$stage/dropship-steamos-helper" \
            "$stage/packaging/install.sh" \
            "$stage/packaging/dropship-steamos.service" \
            "$stage/packaging/dropship-steamos.desktop" \
            "$stage/assets/icons/game-icon-overwatch.svg" \
            "$stage/README.md" \
            "$stage/INSTALL.md" \
            "$stage/LICENSE"
          do
            tar -tzf "$tarball" | grep -qx "$p" || { echo "missing $p" >&2; exit 1; }
          done

          # An archive that extracts with the exec bit missing gives the user
          # "./install.sh: Permission denied", which reads as "the download is
          # broken" and is not obviously diagnosable from there.
          tar -tvzf "$tarball" | awk '$1 ~ /^-rwxr-xr-x$/ {print $NF}' | sort > actual-exec
          printf '%s\n' \
            "$stage/dropship-steamos" \
            "$stage/dropship-steamos-helper" \
            "$stage/install.sh" \
            "$stage/packaging/install.sh" | sort > expected-exec
          diff -u expected-exec actual-exec

          mkdir -p unpacked
          tar -xzf "$tarball" -C unpacked
          sh -n "unpacked/$stage/install.sh"
          sh -n "unpacked/$stage/packaging/install.sh"
          # shellcheck is preinstalled on the runner. This is the only place
          # either script is ever executed by a machine that is not a Deck.
          shellcheck -s sh "unpacked/$stage/install.sh" "unpacked/$stage/packaging/install.sh"

      # The only automated proof that the installer's preflight works, and it is
      # safe on a runner precisely because the preflight runs before any
      # mutation: no systemctl, no nft, nothing that needs a real systemd.
      - name: a missing piece must fail before anything is installed
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          stage=dropship-steamos-$version
          work=$(mktemp -d)

          # detect_desktop_user() takes SUDO_USER, which sudo sets to this
          # runner, so these are the launcher paths the installer would write.
          desktop_home=$(getent passwd "$(id -un)" | cut -d: -f6)
          gui_dir=$desktop_home/.local/lib/dropship-steamos
          launcher=$desktop_home/.local/share/applications/dropship-steamos.desktop

          assert_nothing_written() {
            if [ -e /etc/systemd/system/dropship-steamos.service ]; then
              echo "the unit was written despite a failed preflight" >&2
              exit 1
            fi
            if [ -e /var/lib/dropship-steamos ]; then
              echo "/var/lib/dropship-steamos was created despite a failed preflight" >&2
              exit 1
            fi
            if [ -e "$gui_dir" ] || [ -e "$launcher" ]; then
              echo "the launcher was installed despite a failed preflight" >&2
              exit 1
            fi
          }

          install_should_fail() { # <name> <helper path> <gui path>
            if sudo env DROPSHIP_STEAMOS_HELPER="$2" DROPSHIP_STEAMOS_GUI="$3" \
                        "unpacked/$stage/packaging/install.sh" \
                        >"$work/$1.out" 2>"$work/$1.err"
            then
              echo "the installer accepted a missing $1" >&2
              exit 1
            fi
            # A bare exit status could be anything. The preflight has to have
            # said why, so a future broken check fails loudly instead of passing
            # on a coincidental error.
            if ! grep -q 'the install is incomplete' "$work/$1.err"; then
              echo "the $1 failure did not name the incomplete install:" >&2
              cat "$work/$1.err" >&2
              exit 1
            fi
            assert_nothing_written
          }

          # Both halves of the payload preflight, not just the GUI.
          install_should_fail gui-missing \
            "$PWD/unpacked/$stage/dropship-steamos-helper" /nonexistent
          install_should_fail helper-missing \
            /nonexistent "$PWD/unpacked/$stage/dropship-steamos"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          tarball=dropship-steamos-$version-linux-x86_64.tar.gz
          # Keyed on the tag, not $version: the notes in the tree are named
          # v0.1.0.md, while $version has the v stripped.
          notes=.github/release-notes/$GITHUB_REF_NAME.md

          # A release with no written caveat is worse than no release: the notes
          # are the one place each release names which half of the feature has
          # actually been exercised on real hardware.
          test -f "$notes" || { echo "no release notes at $notes" >&2; exit 1; }

          # Only the tarball and the checksum are attached. Publishing the loose
          # binaries as well would invite someone to download the helper on its
          # own and run it as root, which is the failure the archive layout
          # exists to prevent.
          gh release create "$GITHUB_REF_NAME" \
            --title "Dropship for SteamOS $version" \
            --notes-file "$notes" \
            "$tarball" SHA256SUMS
