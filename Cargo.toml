[package]
name = "dropship-steamos"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
description = "A native SteamOS server selector for Overwatch 2"

[[bin]]
name = "dropship-steamos"
path = "src/main.rs"

[[bin]]
name = "dropship-steamos-helper"
path = "src/bin/dropship-steamos-helper.rs"

[dependencies]
anyhow = "1"
eframe = "0.31"
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the GUI's two ways of leaving at once: the SIGTERM handler, because a
# session that is ending must be able to take this process down even if it is
# mid-syscall, and the frame watchdog, which uses the same handler to take itself
# down when the display stops answering the window.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
